<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SWAP - 2K24 Registration</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="keywords" content="registration, swap, events">
    <meta name="description" content="Register for the SWAP 2K24 event.">

    <!-- Favicons -->
    <link rel="shortcut icon" href="finswaplogo.png" type="image/x-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,700,700i|Raleway:300,400,500,700,800" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS File -->
    <link href="lib/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <!-- Libraries CSS Files -->
    <link href="lib/font-awesome/css/font-awesome.min.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/venobox/venobox.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Main Stylesheet File -->
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="clgname">
      <h2 style="font-weight: bold;">College Name :</h2>
      <h2>JMC</h2>
    </div>
    <div class="deptname">
      <h2 style="font-weight: bold;">Department Name :</h2>
      <h2>MCA</h2>
    </div>
    <div class="numparticipants">
      <h2 style="font-weight: bold;">Participants :</h2>
    </div>

    <button type="button" class="btn btn-primary mt-3 d-inline " data-bs-target="#registerForm" data-bs-toggle="modal" style="font-weight: bold; padding: 10px 20px; border-radius: 10px;">Add +</button>

  </div>

    <!-- Register Form -->
    <div class="modal fade" id="registerForm" aria-hidden="true" aria-labelledby="registerFormLabel" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #dfe3ed; color:black;">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="registerFormLabel">Register Form</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label for="reg-no" class="form-label">Participant Register Number :</label>
                            <input type="text" id="reg-no" class="form-control" placeholder="Enter Register Number">
                        </div>

                        <div class="mb-3">
                            <label for="participant-name" class="form-label">Participant Name :</label>
                            <input type="text" id="participant-name" class="form-control" placeholder="Enter Name">
                        </div>

                        <div class="mb-3">
                            <label for="mbno" class="form-label">Participant Mobile Number :</label>
                            <input type="text" id="mbno" class="form-control" placeholder="Enter Mobile Number">
                        </div>

                        <div class="mb-3">
                            <label for="event-1" class="form-label">Event-1 :</label>
                            <select id="event-1" class="form-select">
                                <option value="none">Select</option>
                                <optgroup label="Technical">
                                    <option value="debugging">Debugging</option>
                                    <option value="web-designing">Web Designing</option>
                                    <option value="query-hunt">Query Hunt</option>
                                    <option value="innovative-ideas">Innovative Ideas</option>
                                </optgroup>
                                <optgroup label="Non-technical">
                                    <option value="ad-zap">Ad-Zap</option>
                                    <option value="crossword">Crossword</option>
                                    <option value="surprise-event">Surprise Event</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="event-2" class="form-label">Event-2 :</label>
                            <select id="event-2" class="form-select">
                                <option value="none">Select</option>
                                <optgroup label="Technical">
                                    <option value="debugging">Debugging</option>
                                    <option value="web-designing">Web Designing</option>
                                    <option value="query-hunt">Query Hunt</option>
                                    <option value="innovative-ideas">Innovative Ideas</option>
                                </optgroup>
                                <optgroup label="Non-technical">
                                    <option value="ad-zap">Ad-Zap</option>
                                    <option value="crossword">Crossword</option>
                                    <option value="surprise-event">Surprise Event</option>
                                </optgroup>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary mt-3">Save & Next</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
    
    <!-- JavaScript Libraries -->
    <script src="lib/jquery/jquery.min.js"></script>
    <script src="lib/jquery/jquery-migrate.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/superfish/hoverIntent.js"></script>
    <script src="lib/superfish/superfish.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/venobox/venobox.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
