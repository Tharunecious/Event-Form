<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Basic styles for the button */
button.log-out {
  background-color: #e74c3c; /* Red background color */
  color: #ffffff; /* White text color */
  border: none; /* Remove default border */
  padding: 10px 20px; /* Add padding */
  font-size: 16px; /* Font size */
  border-radius: 5px; /* Rounded corners */
  cursor: pointer; /* Pointer cursor on hover */
  transition: background-color 0.3s ease; /* Smooth background color transition */
}

/* Styles for the button when hovered */
button.log-out:hover {
  background-color: #c0392b; /* Darker red background on hover */
}

/* Styles for the button when focused */
button.log-out:focus {
  outline: none; /* Remove default outline */
  box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.5); /* Add custom focus ring */
}

    </style>
</head>
<body>
    <button class="log-out">Log Out</button>
</body>
</html>
